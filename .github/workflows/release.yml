name: Release build

on:
  push:
    tags: ['[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm audit --omit=dev
      - run: npm run build
      - name: Validate release version
        run: node -e 'const m=require("./manifest.json"); if(m.version !== process.env.GITHUB_REF_NAME || m.version !== require("./package.json").version) process.exit(1)'
      - name: Attest installable assets
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
      - name: Publish installable assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/main.js dist/manifest.json --verify-tag --title "FlyMind $RELEASE_TAG" --notes-file RELEASE_NOTES.md
